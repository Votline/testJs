version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tzts_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: tzts_card
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tzts_card"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tzts_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/tzts_card?schema=public"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
